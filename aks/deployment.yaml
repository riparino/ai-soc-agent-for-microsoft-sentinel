apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-soc-agent
  namespace: sentinel-soc
  labels:
    app: sentinel-soc-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel-soc-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sentinel-soc-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: agent
          image: YOUR_ACR_NAME.azurecr.io/sentinel-soc-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: sentinel-soc-config
            - secretRef:
                name: sentinel-soc-secret
          volumeMounts:
            # Delegated Lighthouse workspace fleet (optional). Mounts workspaces.json
            # at /etc/sentinel when the sentinel-soc-fleet ConfigMap exists; the app
            # falls back to the single AZURE_* workspace when it is absent.
            - name: fleet-config
              mountPath: /etc/sentinel
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        # Mounted from a Secret (the fleet file may carry per-customer Graph secrets).
        # optional:true means the pod starts even without it (single-workspace mode);
        # create the Secret from workspaces.json to enable the delegated fleet.
        - name: fleet-config
          secret:
            secretName: sentinel-soc-fleet
            optional: true
